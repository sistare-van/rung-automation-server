name: Daily Briefing Email

on:
  schedule:
    # 13:05 UTC daily = 9:05am ET (EDT). Handles DST by lagging briefly in EST (8:05am).
    - cron: "5 13 * * *"
  workflow_dispatch: {}

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 50

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci --omit=dev

      - name: Send briefing
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
        run: node scripts/send-daily-brief.js
